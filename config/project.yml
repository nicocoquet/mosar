project:
  id: mosar
  name: Mosar
  site_url: "https://nicocoquet.github.io/mosar/"

data:
  file: "data/Recensement-revues-stat.xlsx"
  sheet: "recensement"

columns:
  journal_name: "Nom"
  mirabel_id: "Mir@bel_ID"
  proximity: "Niveau rattachement"
  open_access: "Accès ouvert"
  format: "Format"
  creation_year: "Année de création"
  periodicity: "Nombre de n°s par an"
  discipline: "Discipline"
  publisher_type: "Type d'éditeur"
  licence: "Licence"

mirabel:
  api: "https://reseau-mirabel.info/api"
  cluster_id: 146
  cluster_name: "Mosar"
  cluster_url: "https://reseau-mirabel.info/grappe/146"

publication:
  statistics:
    downloads: "docs/downloads"
    pages:
      fr:
        intro: "content/statistiques-intro.fr.md"
        output: "docs/statistiques.md"
      en:
        intro: "content/statistiques-intro.en.md"
        output: "docs/statistiques.en.md"

  journals:
    pages:
      fr:
        intro: "content/revues-intro.fr.md"
        output: "docs/revues.md"
      en:
        intro: "content/revues-intro.en.md"
        output: "docs/revues.en.md"
    data_file: "docs/assets/data/revues-exploration.json"
    report_file: "data/revues/join-report.json"
    fallback:
      enabled: false
      file: "data/mirabel/mosar-test-enrichment.csv"

privacy:
  forbidden_columns:
    - "Contacts"
    - "Divers"
    - "Questionnaire envoyé le"
    - "Réponse reçue le"
    - "Relance faite le"
