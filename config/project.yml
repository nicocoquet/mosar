project:
  id: mosar
  name: Mosar
  site_url: "https://nicocoquet.github.io/mosar/"

data:
  file: "data/Recensement-revues-Mosar.xlsx"
  sheet: "recensement"

columns:
  journal_name: "Nom"
  journal_subtitle: "Sous-titre/complément"
  mirabel_id: "Mir@bel_ID"
  proximity: "Niveau rattachement"
  open_access: "Accès ouvert"
  format: "Format"
  creation_year: "Année de création"
  periodicity: "Périodicité"
  discipline: "Discipline"
  sector: "Secteur"
  publisher_type: "Type d'éditeur"
  licence: "Licence"
  licence_mentioned: "Licence mentionnée"
  issn_print: "ISSN"
  issn_electronic: "ISSN-E"
  msh: "MSH"
  upn: "UPN"
  up1: "UP1"
  laboratory: "Laboratoire"
  association: "Association"
  publisher: "Éditeur"
  digital_distributor: "Diffuseur numérique"
  wikipedia: "Wikipédia"
  wikipedia_url: "Wikipédia_URL"
  website: "Site web"

mirabel:
  api: "https://reseau-mirabel.info/api"
  cluster_id: 146
  cluster_name: "Mosar"
  cluster_url: "https://reseau-mirabel.info/grappe/146"

publication:
  statistics:
    downloads: "docs/downloads"
    pages:
      fr:
        intro: "content/statistiques-intro.fr.md"
        output: "docs/statistiques.md"
      en:
        intro: "content/statistiques-intro.en.md"
        output: "docs/statistiques.en.md"

  journals:
    pages:
      fr:
        intro: "content/revues-intro.fr.md"
        output: "docs/revues.md"
      en:
        intro: "content/revues-intro.en.md"
        output: "docs/revues.en.md"
    data_file: "docs/data/journals-exploration.json"
    report_file: "data/journals/join-report.json"
    fallback:
      enabled: false
      file: "data/mirabel/mosar-test-enrichment.csv"

privacy:
  forbidden_columns:
    - "Contacts"
    - "Personnel à disposition"
    - "Source de financement"
