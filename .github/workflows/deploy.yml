name: Publier les statistiques

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Installer Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dépendances
        run: python -m pip install -r requirements.txt

      - name: Générer les statistiques depuis le XLSX
        if: ${{ hashFiles('data/Recensement-revues-stat.xlsx') != '' }}
        run: python scripts/generate_statistics.py

      - name: Vérifier la construction du site
        run: mkdocs build --strict

      - name: Configurer Git
        if: github.event_name != 'pull_request'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Publier sur GitHub Pages
        if: github.event_name != 'pull_request'
        run: mkdocs gh-deploy --force
