name: Publier les statistiques

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Installer Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dépendances
        run: python -m pip install -r requirements.txt

      - name: Vérifier que le XLSX est expurgé
        run: python scripts/sanitize_xlsx.py --check

      - name: Tester le moteur statistique sur le corpus fixture
        run: python tests/check_fixture.py

      - name: Générer les statistiques depuis le XLSX
        run: python scripts/generate_statistics.py

      - name: Préparer les graphiques réutilisables
        run: python scripts/prepare_reusable_charts.py

      - name: Contrôler la non-régression statistique
        run: python scripts/check_regression.py

      - name: Générer la page Revues
        run: python scripts/generate_journals_exploration.py

      - name: Contrôler la structure des données Revues
        run: python scripts/check_journals_output.py

      - name: Contrôler le JavaScript Revues
        run: node scripts/check_journals_js.js

      - name: Vérifier la construction du site
        run: mkdocs build --strict

      - name: Configurer Git
        if: github.event_name != 'pull_request'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Publier sur GitHub Pages
        if: github.event_name != 'pull_request'
        run: mkdocs gh-deploy --force
