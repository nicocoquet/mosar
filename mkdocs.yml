site_name: Projet Mosar | FNSO
site_description: Modèle ouvert de soutien et d’accompagnement des revues
site_url: https://nicocoquet.github.io/mosar/

nav:
  - Home: index.md
  - 2026 Survey: rapport.md
  - Statistics: statistiques.md
  - Journals: revues.md
  - Contacts: contacts.md

theme:
  name: material
  language: fr
  logo: assets/logos/mosar.svg
  favicon: assets/icons/favicon.png
  features:
    - navigation.tabs
    - navigation.tabs.sticky
  palette:
    scheme: default
    primary: indigo
    accent: blue

plugins:
  - search
  - i18n:
      docs_structure: suffix
      languages:
        - locale: fr
          default: true
          name: Français
          build: true
          nav_translations:
            Home: Accueil
            2026 Survey: Enquête 2026
            Statistics: Statistiques
            Journals: Revues
            Contacts: Contacts
        - locale: en
          name: English
          build: true

markdown_extensions:
  - toc:
      toc_depth: "2-3"
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.snippets:
      base_path:
        - .

extra_javascript:
  - javascripts/language-switch.js
  - javascripts/statistics-toc.js

extra_css:
  - stylesheets/extra.css
  - stylesheets/header.css
  - stylesheets/home.css

copyright: "Projet Mosar | FNSO (2026-2028)"
